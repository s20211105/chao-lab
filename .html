<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chaos Lab - Physics Sandbox</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #0f172a; user-select: none; }
        #canvas-container { width: 100vw; height: 100vh; display: block; }
        .ui-panel {
            backdrop-filter: blur(12px);
            background-color: rgba(2, 6, 23, 0.85);
            border: 1px solid rgba(30, 41, 59, 0.5);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(56, 189, 248, 0.2); border-radius: 3px; }
    </style>
</head>
<body>

    <!-- UI Overlay -->
    <div class="absolute top-4 left-4 z-10 w-80">
        <div class="ui-panel rounded-xl p-6 text-white shadow-2xl transition-all duration-300">
            <h1 class="text-2xl font-bold mb-1 text-slate-100 tracking-tight bg-gradient-to-r from-cyan-400 to-blue-500 bg-clip-text text-transparent">Chaos Lab</h1>
            <p class="text-slate-400 text-xs font-mono mb-5">
                PHYSICS SANDBOX // <span class="text-cyan-500">REALISTIC PHYSICS</span>
            </p>

            <div class="space-y-5">
                <!-- Object Type Selector -->
                <div>
                    <label class="text-[10px] font-bold text-slate-500 uppercase tracking-widest">Projectile</label>
                    <div class="flex gap-2 mt-2">
                        <button id="btn-sphere" class="flex-1 py-2 px-3 bg-cyan-900/30 hover:bg-cyan-900/50 text-cyan-200 rounded text-xs font-bold transition-all border border-cyan-500/30">SPHERE</button>
                        <button id="btn-box" class="flex-1 py-2 px-3 bg-transparent hover:bg-slate-800 text-slate-500 rounded text-xs font-bold transition-all border border-slate-800">CUBE</button>
                    </div>
                </div>

                <!-- Power Slider -->
                <div>
                    <div class="flex justify-between mb-2">
                        <label class="text-[10px] font-bold text-slate-500 uppercase tracking-widest">Launch Force</label>
                        <span id="force-val" class="text-[10px] text-cyan-400 font-mono">2000N</span>
                    </div>
                    <input type="range" id="force-slider" min="100" max="5000" value="2000" class="w-full h-1 bg-slate-800 rounded-lg appearance-none cursor-pointer accent-cyan-500">
                </div>
                
                 <!-- Gravity Control -->
                 <div>
                    <div class="flex justify-between mb-2">
                        <label class="text-[10px] font-bold text-slate-500 uppercase tracking-widest">Gravity</label>
                        <span id="gravity-val" class="text-[10px] text-indigo-400 font-mono">-9.8</span>
                    </div>
                    <input type="range" id="gravity-slider" min="-30" max="10" step="0.5" value="-9.8" class="w-full h-1 bg-slate-800 rounded-lg appearance-none cursor-pointer accent-indigo-500">
                </div>

                <!-- Time Speed Control -->
                <div>
                    <div class="flex justify-between mb-2">
                        <label class="text-[10px] font-bold text-slate-500 uppercase tracking-widest">Time Speed</label>
                        <span id="time-val" class="text-[10px] text-green-400 font-mono">1.0x</span>
                    </div>
                    <input type="range" id="time-slider" min="0.1" max="2.0" step="0.1" value="1.0" class="w-full h-1 bg-slate-800 rounded-lg appearance-none cursor-pointer accent-green-500">
                </div>

                <!-- Actions -->
                <div class="pt-4 border-t border-slate-800/50 flex flex-col gap-2">
                    <button id="btn-reset" class="w-full py-2 bg-red-900/20 hover:bg-red-900/30 text-red-400 border border-red-900/30 rounded text-xs font-bold transition-all tracking-wide">
                        CLEAR AREA
                    </button>
                    <button id="btn-blackhole" class="w-full py-2 bg-purple-900/20 hover:bg-purple-900/40 text-purple-300 border border-purple-500/30 rounded text-xs font-bold transition-all tracking-wide">
                        SPAWN BLACK HOLE
                    </button>
                    <div class="flex gap-2">
                        <button id="btn-pyramid" class="flex-1 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded text-xs font-bold transition-all border border-slate-700">
                            PYRAMID
                        </button>
                        <button id="btn-building" class="flex-1 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded text-xs font-bold transition-all border border-slate-700">
                            STRUCT
                        </button>
                    </div>
                </div>
            </div>
            
            <div class="mt-4 pt-2 text-[10px] text-slate-600 text-center font-mono border-t border-slate-800/30">
                ENTITIES: <span id="obj-count" class="text-cyan-500">0</span> | DEBRIS: <span id="debris-count" class="text-orange-500">0</span>
            </div>
        </div>
    </div>

    <!-- Canvas Container -->
    <div id="canvas-container"></div>

    <!-- Import Map for Modules -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
                "cannon-es": "https://unpkg.com/cannon-es@0.20.0/dist/cannon-es.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import * as CANNON from 'cannon-es';

        // --- SHADERS ---

        // 1. Concrete Shader (High Detail)
        const concreteVertexShader = `
            varying vec3 vNormal;
            varying vec3 vViewPosition;
            varying vec3 vWorldPosition;
            varying vec2 vUv;
            void main() {
                vUv = uv;
                vNormal = normalize(normalMatrix * normal);
                vec4 worldPosition = modelMatrix * vec4(position, 1.0);
                vWorldPosition = worldPosition.xyz;
                vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
                vViewPosition = -mvPosition.xyz;
                gl_Position = projectionMatrix * mvPosition;
            }
        `;

        const concreteFragmentShader = `
            uniform vec3 uColor;
            uniform vec3 uSunPosition;
            varying vec3 vNormal;
            varying vec3 vViewPosition;
            varying vec3 vWorldPosition;

            float hash(float n) { return fract(sin(n) * 753.5453123); }
            float noise(vec3 x) {
                vec3 p = floor(x);
                vec3 f = fract(x);
                f = f * f * (3.0 - 2.0 * f);
                float n = p.x + p.y * 157.0 + 113.0 * p.z;
                return mix(mix(mix(hash(n + 0.0), hash(n + 1.0), f.x),
                               mix(hash(n + 157.0), hash(n + 158.0), f.x), f.y),
                           mix(mix(hash(n + 113.0), hash(n + 114.0), f.x),
                               mix(hash(n + 270.0), hash(n + 271.0), f.x), f.y), f.z);
            }
            float fbm(vec3 p) {
                float f = 0.0; float w = 0.5;
                for(int i = 0; i < 5; i++) { f += w * noise(p); p *= 2.0; w *= 0.5; }
                return f;
            }

            void main() {
                // More detailed noise for grunge
                float grain = fbm(vWorldPosition * 3.0);
                float dirt = fbm(vWorldPosition * 0.8 + vec3(5.0));
                
                // Add some edge darkening based on noise
                float edge = smoothstep(0.4, 0.6, dirt);
                
                vec3 finalColor = uColor * (0.6 + 0.4 * grain);
                finalColor = mix(finalColor, finalColor * 0.5, edge * 0.3); // Apply dirt patches

                vec3 normal = normalize(vNormal);
                vec3 viewDir = normalize(vViewPosition);
                vec3 lightDir = normalize(vec3(0.4, 1.0, 0.6)); 
                
                float diff = max(dot(normal, lightDir), 0.0);
                vec3 reflectDir = reflect(-lightDir, normal);
                float spec = pow(max(dot(viewDir, reflectDir), 0.0), 32.0); // Sharper spec
                
                vec3 ambient = vec3(0.25, 0.3, 0.4) * finalColor; 
                vec3 diffuseLight = vec3(0.95, 0.95, 1.0) * diff * finalColor; 
                vec3 specularLight = vec3(0.8) * spec; // Brighter highlights
                
                float rim = 1.0 - max(dot(viewDir, normal), 0.0);
                rim = pow(rim, 4.0);
                vec3 rimLight = vec3(0.4, 0.7, 1.0) * rim * 0.5;

                vec3 lighting = ambient + diffuseLight + specularLight + rimLight;

                float dist = length(vViewPosition);
                float fogFactor = smoothstep(30.0, 150.0, dist);
                vec3 fogColor = vec3(0.06, 0.09, 0.16); 
                
                gl_FragColor = vec4(mix(lighting, fogColor, fogFactor), 1.0);
            }
        `;

        // --- Global Variables ---
        let camera, scene, renderer;
        let world;
        let timeStep = 1 / 60;
        let lastCallTime;
        let objectsToUpdate = [];
        let debrisParticles = []; // Debris system
        let physicsMaterial;
        let controls;
        let audioCtx;
        
        // Game Feel
        let cameraShake = 0;
        
        // Black Hole State
        let isBlackHoleActive = false;
        let blackHoleMesh = null;
        let blackHoleRing = null;
        const blackHolePosition = new CANNON.Vec3(0, 10, 0); // Center of arena, high up
        
        const state = {
            projectileType: 'sphere', 
            launchForce: 2000, 
            gravity: -9.82,
            timeSpeed: 1.0
        };

        const ui = {
            btnSphere: document.getElementById('btn-sphere'),
            btnBox: document.getElementById('btn-box'),
            btnReset: document.getElementById('btn-reset'),
            btnBlackHole: document.getElementById('btn-blackhole'),
            btnPyramid: document.getElementById('btn-pyramid'),
            btnBuilding: document.getElementById('btn-building'),
            forceSlider: document.getElementById('force-slider'),
            forceVal: document.getElementById('force-val'),
            gravitySlider: document.getElementById('gravity-slider'),
            gravityVal: document.getElementById('gravity-val'),
            timeSlider: document.getElementById('time-slider'),
            timeVal: document.getElementById('time-val'),
            objCount: document.getElementById('obj-count'),
            debrisCount: document.getElementById('debris-count')
        };

        init();
        animate();

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0f172a); 
            scene.fog = new THREE.Fog(0x0f172a, 30, 140);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(30, 20, 30);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.4;
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.maxPolarAngle = Math.PI / 2 - 0.05;

            // Lights
            const ambientLight = new THREE.AmbientLight(0x94a3b8, 0.8);
            scene.add(ambientLight);

            const moonLight = new THREE.DirectionalLight(0xffffff, 1.5);
            moonLight.position.set(50, 80, 50);
            moonLight.castShadow = true;
            // Increased shadow map size for realism
            moonLight.shadow.mapSize.width = 4096;
            moonLight.shadow.mapSize.height = 4096;
            moonLight.shadow.bias = -0.0001; // Reduce shadow acne
            moonLight.shadow.camera.near = 0.5;
            moonLight.shadow.camera.far = 200;
            moonLight.shadow.camera.left = -50;
            moonLight.shadow.camera.right = 50;
            moonLight.shadow.camera.top = 50;
            moonLight.shadow.camera.bottom = -50;
            scene.add(moonLight);
            
            const cityGlow = new THREE.PointLight(0x22d3ee, 1.5, 120);
            cityGlow.position.set(-30, 20, -30);
            scene.add(cityGlow);
            
            const accentLight = new THREE.PointLight(0xe879f9, 1.2, 120);
            accentLight.position.set(30, 30, -10);
            scene.add(accentLight);

            // Physics Setup
            world = new CANNON.World();
            world.gravity.set(0, state.gravity, 0);
            world.broadphase = new CANNON.SAPBroadphase(world);
            world.allowSleep = true;
            
            // --- REALISM TWEAKS ---
            world.solver.iterations = 50; 
            world.solver.tolerance = 0.001;

            const defaultMaterial = new CANNON.Material('default');
            const defaultContactMaterial = new CANNON.ContactMaterial(
                defaultMaterial,
                defaultMaterial,
                { 
                    friction: 0.9,      
                    restitution: 0.0,   
                    contactEquationStiffness: 1e7,
                    contactEquationRelaxation: 4
                }
            );
            world.addContactMaterial(defaultContactMaterial);
            physicsMaterial = defaultMaterial;

            // Black Hole setup
            initBlackHole();

            createFloor();
            // Removed createCityBackground() here
            createRealisticBuilding(0, 0);

            window.addEventListener('resize', onWindowResize);
            window.addEventListener('pointerdown', onPointerDown);
            setupUI();
        }

        // --- Black Hole Logic ---
        function initBlackHole() {
            // Event Horizon (Black Sphere)
            const bhGeo = new THREE.SphereGeometry(2, 64, 64);
            const bhMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
            blackHoleMesh = new THREE.Mesh(bhGeo, bhMat);
            blackHoleMesh.position.set(blackHolePosition.x, blackHolePosition.y, blackHolePosition.z);
            blackHoleMesh.visible = false;
            scene.add(blackHoleMesh);

            // Accretion Disk (Glowing Ring)
            const ringGeo = new THREE.RingGeometry(3, 8, 64);
            const ringMat = new THREE.MeshBasicMaterial({ 
                color: 0xa855f7, 
                side: THREE.DoubleSide,
                transparent: true,
                opacity: 0.8,
                blending: THREE.AdditiveBlending
            });
            blackHoleRing = new THREE.Mesh(ringGeo, ringMat);
            blackHoleRing.rotation.x = -Math.PI / 2; // Flat
            blackHoleMesh.add(blackHoleRing); // Child of BH mesh
        }

        function toggleBlackHole() {
            isBlackHoleActive = !isBlackHoleActive;
            
            if (isBlackHoleActive) {
                initAudio();
                blackHoleMesh.visible = true;
                ui.btnBlackHole.innerText = "DISABLE BLACK HOLE";
                ui.btnBlackHole.classList.add("bg-purple-600", "text-white");
                ui.btnBlackHole.classList.remove("bg-purple-900/20", "text-purple-300");
                playBlackHoleSound();
            } else {
                blackHoleMesh.visible = false;
                ui.btnBlackHole.innerText = "SPAWN BLACK HOLE";
                ui.btnBlackHole.classList.remove("bg-purple-600", "text-white");
                ui.btnBlackHole.classList.add("bg-purple-900/20", "text-purple-300");
                // Reset gravity
                world.gravity.set(0, state.gravity, 0);
            }
        }

        function applyBlackHoleForces() {
            if (!isBlackHoleActive) return;

            // Rotate ring
            blackHoleRing.rotation.z += 0.1 * state.timeSpeed; // Scale visual rotation by time

            // Apply forces
            // F = G * m1 * m2 / r^2
            // We simplify to F = Strength * mass / dist^2
            const strength = 10000; // Gravity well strength

            objectsToUpdate.forEach(obj => {
                const body = obj.body;
                
                // Vector from body to black hole
                const forceDir = blackHolePosition.vsub(body.position);
                const distance = forceDir.length();
                
                // Singularity guard: If too close, stop pulling to prevent chaotic slingshots
                if (distance < 2.5) {
                    // "Inside" the black hole - add drag
                    body.velocity.scale(0.9, body.velocity);
                    return; 
                }

                forceDir.normalize();
                
                // Inverse Square Law with clamp to prevent infinity
                const forceMagnitude = (strength * body.mass) / (distance * distance * 0.1); 
                
                const force = forceDir.scale(forceMagnitude);
                
                body.applyForce(force, body.position);
                body.wakeUp();
            });

            // Nullify global gravity slightly when BH is active so things float towards it
            world.gravity.set(0, 0, 0);
        }

        // --- DEBRIS SYSTEM ---
        const debrisGeo = new THREE.BoxGeometry(0.1, 0.1, 0.1);
        const debrisMat = new THREE.MeshBasicMaterial({ color: 0x94a3b8, transparent: true });

        function spawnDebris(position, color, count = 5) {
            for (let i = 0; i < count; i++) {
                // Instancing would be better for performance but simpler mesh cloning is fine for < 500 particles
                const mesh = new THREE.Mesh(debrisGeo, debrisMat.clone());
                mesh.material.color.setHex(color);
                
                // Random spread
                mesh.position.copy(position);
                mesh.position.x += (Math.random() - 0.5) * 0.5;
                mesh.position.y += (Math.random() - 0.5) * 0.5;
                mesh.position.z += (Math.random() - 0.5) * 0.5;
                
                // Random Velocity
                const velocity = new THREE.Vector3(
                    (Math.random() - 0.5) * 5,
                    Math.random() * 5,
                    (Math.random() - 0.5) * 5
                );

                scene.add(mesh);
                debrisParticles.push({
                    mesh: mesh,
                    velocity: velocity,
                    life: 1.0 + Math.random() * 0.5 // Seconds
                });
            }
        }

        function updateDebris(dt) {
            for (let i = debrisParticles.length - 1; i >= 0; i--) {
                const p = debrisParticles[i];
                p.life -= dt;
                
                if (p.life <= 0) {
                    scene.remove(p.mesh);
                    debrisParticles.splice(i, 1);
                    continue;
                }

                // Simple Euler integration
                p.velocity.y += -9.8 * dt; // Gravity
                p.mesh.position.add(p.velocity.clone().multiplyScalar(dt));
                p.mesh.rotation.x += p.velocity.z * dt;
                p.mesh.rotation.z += p.velocity.x * dt;

                // Ground collision floor
                if (p.mesh.position.y < 0) {
                    p.mesh.position.y = 0;
                    p.velocity.y *= -0.5; // Bounce
                    p.velocity.x *= 0.8; // Friction
                    p.velocity.z *= 0.8;
                }

                // Fade out
                p.mesh.material.opacity = p.life;
                p.mesh.scale.setScalar(p.life); // Shrink
            }
            ui.debrisCount.innerText = debrisParticles.length;
        }

        function createFloor() {
            const geometry = new THREE.CylinderGeometry(40, 40, 2, 64);
            const material = new THREE.ShaderMaterial({
                vertexShader: concreteVertexShader,
                fragmentShader: concreteFragmentShader,
                uniforms: {
                    uColor: { value: new THREE.Color(0x1e293b) },
                    uSunPosition: { value: new THREE.Vector3(50, 80, 50).normalize() }
                }
            });
            const mesh = new THREE.Mesh(geometry, material);
            mesh.position.y = -1;
            mesh.receiveShadow = true;
            scene.add(mesh);

            const planeShape = new CANNON.Plane();
            const planeBody = new CANNON.Body({ mass: 0, shape: planeShape, material: physicsMaterial });
            planeBody.quaternion.setFromAxisAngle(new CANNON.Vec3(1, 0, 0), -Math.PI / 2);
            world.addBody(planeBody);
        }

        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playShootSound() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.type = 'sawtooth';
            // Adjust pitch based on time speed for effect (optional)
            const pitchMod = Math.max(0.5, state.timeSpeed);
            osc.frequency.setValueAtTime(150 * pitchMod, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(40 * pitchMod, audioCtx.currentTime + 0.2);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.2);
        }

        function playImpactSound(velocity, mass) {
            if (!audioCtx || velocity < 1.0) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            const filter = audioCtx.createBiquadFilter();
            
            // Adjust sound properties based on time speed for fun effect
            const speedMod = Math.max(0.5, state.timeSpeed);
            
            filter.type = 'lowpass';
            filter.frequency.value = (300 + (velocity * 10)) * speedMod;
            osc.connect(filter);
            filter.connect(gain);
            gain.connect(audioCtx.destination);
            osc.type = mass > 10 ? 'square' : 'triangle';
            
            const pitch = (40 + Math.random() * 40) * speedMod;
            osc.frequency.setValueAtTime(pitch, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(10 * speedMod, audioCtx.currentTime + 0.15);
            const vol = Math.min(velocity * 0.04 * (mass * 0.1), 0.4);
            gain.gain.setValueAtTime(vol, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.15);
        }

        function playBlackHoleSound() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            const filter = audioCtx.createBiquadFilter();

            osc.type = 'sine';
            osc.frequency.value = 50; 
            
            const lfo = audioCtx.createOscillator();
            lfo.frequency.value = 2; 
            const lfoGain = audioCtx.createGain();
            lfoGain.gain.value = 20;
            lfo.connect(lfoGain);
            lfoGain.connect(osc.frequency);
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            lfo.start();
            osc.start();
            
            gain.gain.setValueAtTime(0, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.3, audioCtx.currentTime + 1);
            
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 3.0);
            osc.stop(audioCtx.currentTime + 3.0);
            lfo.stop(audioCtx.currentTime + 3.0);
        }

        function createObject(shapeType, position, size, mass, colorInput, shouldSleep = false) {
            let geometry, shape, mesh;
            const baseColor = new THREE.Color(colorInput);
            
            const material = new THREE.ShaderMaterial({
                vertexShader: concreteVertexShader,
                fragmentShader: concreteFragmentShader,
                uniforms: {
                    uColor: { value: baseColor },
                    uSunPosition: { value: new THREE.Vector3(50, 80, 50).normalize() }
                }
            });

            if (shapeType === 'sphere') {
                geometry = new THREE.SphereGeometry(size.r, 32, 32);
                shape = new CANNON.Sphere(size.r);
            } else {
                geometry = new THREE.BoxGeometry(size.x, size.y, size.z);
                shape = new CANNON.Box(new CANNON.Vec3(size.x / 2, size.y / 2, size.z / 2));
            }

            mesh = new THREE.Mesh(geometry, material);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            scene.add(mesh);

            const body = new CANNON.Body({
                mass: mass,
                position: new CANNON.Vec3(position.x, position.y, position.z),
                shape: shape,
                material: physicsMaterial,
                linearDamping: 0.01,
                angularDamping: 0.1 
            });
            
            if (shouldSleep) body.sleep();

            let lastSoundTime = 0;
            body.addEventListener("collide", (e) => {
                const v = e.contact.getImpactVelocityAlongNormal();
                const now = performance.now();
                if (Math.abs(v) > 2.0) { // Slightly higher threshold for debris
                    
                    // Sound Throttling
                    if (now - lastSoundTime > 100) {
                        playImpactSound(Math.abs(v), mass);
                        lastSoundTime = now;
                    }

                    // Debris & Shake logic (Throttled globally by frame time usually, but here by magnitude)
                    if (Math.abs(v) > 5.0) {
                        // Shake Camera
                        cameraShake = Math.min(cameraShake + (v * 0.005), 0.5);
                        
                        // Spawn Debris at contact point
                        // Contact point is roughly object position for simple shapes
                        // Better: e.contact.bj.position or bi.position depending on which is which
                        const debrisCount = Math.min(Math.floor(v), 8);
                        spawnDebris(mesh.position, colorInput, debrisCount);
                    }
                }
            });

            world.addBody(body);
            const object = { mesh, body };
            objectsToUpdate.push(object);
            updateObjectCount();
            return object;
        }

        function shootProjectile(event) {
            initAudio(); 
            playShootSound();

            const raycaster = new THREE.Raycaster();
            const mouse = new THREE.Vector2();
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            
            const spawnPos = new THREE.Vector3().copy(camera.position).add(raycaster.ray.direction.clone().multiplyScalar(3));
            
            const isSphere = state.projectileType === 'sphere';
            const color = isSphere ? 0x22d3ee : 0x94a3b8; 
            const size = isSphere ? { r: 0.6 } : { x: 1.2, y: 1.2, z: 1.2 };
            const mass = 200; 
            
            const obj = createObject(state.projectileType, spawnPos, size, mass, color, false);

            const force = raycaster.ray.direction.clone().multiplyScalar(state.launchForce);
            obj.body.velocity.set(force.x, force.y, force.z);
            
            // Initial recoil shake
            cameraShake += 0.05;
        }

        function createPyramid(x, z) {
            const boxSize = 1;
            const levels = 6;
            for (let i = 0; i < levels; i++) {
                const boxesInLevel = levels - i;
                const offset = (boxesInLevel - 1) * boxSize * 0.5;
                for (let j = 0; j < boxesInLevel; j++) {
                    const bx = x + (j * boxSize) - offset;
                    const by = 0.5 + (i * boxSize); 
                    const shade = 0.3 + Math.random() * 0.2;
                    const color = new THREE.Color(shade, shade, shade + 0.1); 
                    createObject('box', { x: bx, y: by, z: z }, { x: 0.98, y: 0.98, z: 0.98 }, 20, color, true);
                }
            }
        }

        function createRealisticBuilding(startX, startZ) {
            const brickW = 1.2;
            const brickH = 0.6;
            const brickD = 0.6;
            const gap = 0.04;
            const floors = 14; 
            const wallBricks = 5; 
            const longWallLen = wallBricks * brickW;
            const radius = (longWallLen - brickW) / 2;

            let currentY = brickH / 2;

            for (let i = 0; i < floors; i++) {
                if (i > 0 && i % 3 === 0) {
                    const slabW = (wallBricks * brickW) + 0.2;
                    const slabD = (wallBricks * brickW) + 0.2;
                    createObject('box', 
                        { x: startX, y: currentY, z: startZ }, 
                        { x: slabW, y: 0.2, z: slabD }, 
                        50, 
                        0x334155, 
                        true
                    );
                    currentY += 0.2 + (brickH/2);
                }

                const isEven = i % 2 === 0;
                const color = new THREE.Color().setHSL(0.02, 0.2, 0.2 + Math.random() * 0.1); 

                if (isEven) {
                    for (let bx = 0; bx < wallBricks; bx++) {
                        const xPos = startX + (bx * brickW) - (longWallLen / 2) + (brickW / 2);
                        createObject('box', { x: xPos, y: currentY, z: startZ + radius }, { x: brickW - gap, y: brickH - gap, z: brickD - gap }, 20, color, true);
                        createObject('box', { x: xPos, y: currentY, z: startZ - radius }, { x: brickW - gap, y: brickH - gap, z: brickD - gap }, 20, color, true);
                    }
                    const span = (2 * radius) - brickD;
                    const shortBricksCount = Math.floor(span / brickW);
                    const startZOffset = -((shortBricksCount * brickW) / 2) + (brickW/2);
                    for (let bz = 0; bz < shortBricksCount; bz++) {
                        const zPos = startZ + startZOffset + (bz * brickW);
                        createObject('box', { x: startX - radius, y: currentY, z: zPos }, { x: brickD - gap, y: brickH - gap, z: brickW - gap }, 20, color, true);
                        createObject('box', { x: startX + radius, y: currentY, z: zPos }, { x: brickD - gap, y: brickH - gap, z: brickW - gap }, 20, color, true);
                    }
                } else {
                    for (let bz = 0; bz < wallBricks; bz++) {
                        const zPos = startZ + (bz * brickW) - (longWallLen / 2) + (brickW / 2);
                        createObject('box', { x: startX - radius, y: currentY, z: zPos }, { x: brickD - gap, y: brickH - gap, z: brickW - gap }, 20, color, true);
                        createObject('box', { x: startX + radius, y: currentY, z: zPos }, { x: brickD - gap, y: brickH - gap, z: brickW - gap }, 20, color, true);
                    }
                    const span = (2 * radius) - brickD;
                    const shortBricksCount = Math.floor(span / brickW);
                    const startXOffset = -((shortBricksCount * brickW) / 2) + (brickW/2);
                    for (let bx = 0; bx < shortBricksCount; bx++) {
                        const xPos = startX + startXOffset + (bx * brickW);
                        createObject('box', { x: xPos, y: currentY, z: startZ + radius }, { x: brickW - gap, y: brickH - gap, z: brickD - gap }, 20, color, true);
                        createObject('box', { x: xPos, y: currentY, z: startZ - radius }, { x: brickW - gap, y: brickH - gap, z: brickD - gap }, 20, color, true);
                    }
                }
                
                currentY += brickH;
            }

            const roofW = (wallBricks * brickW) + 0.5;
            createObject('box', 
                { x: startX, y: currentY, z: startZ }, 
                { x: roofW, y: 0.3, z: roofW }, 
                50, 
                0x1e293b, 
                true
            );
            
            createObject('box', 
                { x: startX + 1, y: currentY + 0.5, z: startZ - 1 }, 
                { x: 1.5, y: 1, z: 1.5 }, 
                10, 
                0x64748b, 
                true
            );
             createObject('box', 
                { x: startX - 1.5, y: currentY + 0.4, z: startZ + 1.5 }, 
                { x: 1, y: 0.8, z: 2 }, 
                10, 
                0x64748b, 
                true
            );
        }

        function resetScene() {
            for (const obj of objectsToUpdate) {
                scene.remove(obj.mesh);
                obj.mesh.geometry.dispose();
                obj.mesh.material.dispose();
                world.removeBody(obj.body);
            }
            
            // Clean up debris
            for (const d of debrisParticles) {
                scene.remove(d.mesh);
            }
            debrisParticles = [];
            
            objectsToUpdate = [];
            updateObjectCount();
            createRealisticBuilding(0, 0);
        }

        function onPointerDown(event) {
            if (event.button === 0 && !event.target.closest('.ui-panel')) {
                shootProjectile(event);
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function setupUI() {
            ui.btnSphere.addEventListener('click', () => {
                state.projectileType = 'sphere';
                ui.btnSphere.classList.remove('bg-transparent', 'text-slate-500', 'border-slate-800');
                ui.btnSphere.classList.add('bg-cyan-900/30', 'text-cyan-200', 'border-cyan-500/30');
                ui.btnBox.classList.remove('bg-cyan-900/30', 'text-cyan-200', 'border-cyan-500/30');
                ui.btnBox.classList.add('bg-transparent', 'text-slate-500', 'border-slate-800');
            });
            ui.btnBox.addEventListener('click', () => {
                state.projectileType = 'box';
                ui.btnBox.classList.remove('bg-transparent', 'text-slate-500', 'border-slate-800');
                ui.btnBox.classList.add('bg-cyan-900/30', 'text-cyan-200', 'border-cyan-500/30');
                ui.btnSphere.classList.remove('bg-cyan-900/30', 'text-cyan-200', 'border-cyan-500/30');
                ui.btnSphere.classList.add('bg-transparent', 'text-slate-500', 'border-slate-800');
            });
            ui.forceSlider.addEventListener('input', (e) => {
                state.launchForce = parseFloat(e.target.value);
                ui.forceVal.innerText = state.launchForce + "N";
            });
            ui.gravitySlider.addEventListener('input', (e) => {
                state.gravity = parseFloat(e.target.value);
                if(!isBlackHoleActive) {
                    world.gravity.set(0, state.gravity, 0);
                }
                ui.gravityVal.innerText = state.gravity;
                objectsToUpdate.forEach(obj => obj.body.wakeUp());
            });
            ui.timeSlider.addEventListener('input', (e) => {
                state.timeSpeed = parseFloat(e.target.value);
                ui.timeVal.innerText = state.timeSpeed + "x";
            });
            ui.btnReset.addEventListener('click', resetScene);
            ui.btnBlackHole.addEventListener('click', toggleBlackHole);
            ui.btnPyramid.addEventListener('click', () => {
                const rx = (Math.random() - 0.5) * 8;
                const rz = (Math.random() - 0.5) * 8;
                createPyramid(rx, rz);
            });
            ui.btnBuilding.addEventListener('click', () => {
                const rx = (Math.random() - 0.5) * 10;
                const rz = (Math.random() - 0.5) * 10;
                createRealisticBuilding(rx, rz);
            });
        }
        
        function updateObjectCount() {
            ui.objCount.innerText = objectsToUpdate.length;
        }

        function animate(time) {
            requestAnimationFrame(animate);
            const currentTime = time / 1000;
            const dt = lastCallTime ? currentTime - lastCallTime : 0;
            const safeDt = Math.min(dt, 0.1); 
            
            const scaledDt = safeDt * state.timeSpeed;

            // Apply Black Hole Physics
            applyBlackHoleForces();
            
            world.step(timeStep, scaledDt, 5);
            
            // Debris Physics
            updateDebris(scaledDt);
            
            lastCallTime = currentTime;

            // Camera Shake Decay
            if (cameraShake > 0) {
                cameraShake *= 0.9;
                if (cameraShake < 0.001) cameraShake = 0;
                
                // Perturb camera position slightly (relative to a base position would be better, but simple addition works if we don't drift)
                // Note: OrbitControls overwrites .position, so we need to add offset inside render or be tricky.
                // Simple hack: We won't modify camera.position permanently.
                const shakeX = (Math.random() - 0.5) * cameraShake;
                const shakeY = (Math.random() - 0.5) * cameraShake;
                const shakeZ = (Math.random() - 0.5) * cameraShake;
                camera.position.add(new THREE.Vector3(shakeX, shakeY, shakeZ));
                
                // Render
                controls.update();
                renderer.render(scene, camera);
                
                // Revert shake so we don't drift away
                camera.position.sub(new THREE.Vector3(shakeX, shakeY, shakeZ));
            } else {
                controls.update();
                renderer.render(scene, camera);
            }

            for (const object of objectsToUpdate) {
                object.mesh.position.copy(object.body.position);
                object.mesh.quaternion.copy(object.body.quaternion);
                if(object.body.position.y < -30) {
                     scene.remove(object.mesh);
                     world.removeBody(object.body);
                }
            }
        }
    </script>
</body>
